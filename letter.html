  <div class="bg-shapes" aria-hidden="true"><span class="shape shape-1"></span><span class="shape shape-2"></span><span class="shape shape-3"></span></div>

  <main class="page-shell">
    <section class="section story-panel reveal" id="letter" data-motion>
      <div class="panel-pin">
        <div class="section-heading">
          <h2>You've Got Mail 💌</h2>
          <p>Click the envelope to open it.</p>
        </div>

        <div class="envelope-scene-wrap">
          <canvas id="envelopeCanvas" aria-hidden="true"></canvas>
          <div class="letter-popup" id="letterPopup" aria-hidden="true" hidden>
            <div class="letter-paper" id="letterPaper">
              <p class="letter-greeting">My love,</p>
              <p>Thank you for being my safest place and my biggest adventure. Every section of this little site points to one truth - I love you.</p>
              <p class="letter-sign">Forever yours.</p>
            </div>
          </div>
          <button class="envelope-click-hint" id="envelopeHint" aria-label="Open envelope">tap to open</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer"><p><a href="index.html">Back to hub</a></p></footer>
